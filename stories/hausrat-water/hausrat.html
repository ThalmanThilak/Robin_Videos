<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Hausrat: the burst pipe</title>
<style>
  @font-face { font-family: "Nunito"; src: url("fonts/Nunito.woff2") format("woff2"); font-weight: 200 1000; }
  html, body { margin: 0; padding: 0; background: #f5f5f2; overflow: hidden; }
  svg { display: block; }
  #hud { position: fixed; left: 8px; top: 8px; font: 14px monospace; color: #888; z-index: 9; }
</style>
</head>
<body>
<svg id="stage" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg"></svg>
<div id="hud"></div>
<script>
// "The burst pipe": 30 s, 9:16 motion-design film for Robin Emig, Allianz (Hausratversicherung).
// Every frame is a pure function of t (seconds). No timers, no CSS transitions, no state between frames.

// ---------- timing (seconds). Filled from the narration word times. ----------
const T = {
  l1: 0.55, everything: 1.6,          // "Your home. Everything you own, in one place."
  l2: 3.8, drop: 4.6, bursts: 6.1,    // "Then one night... a water pipe bursts."
  sofa: 7.2, laptop: 8.1, rug: 9.0, ruined: 9.8,
  insure: 11.1,                        // "Your household contents insurance replaces them."
  old: 14.5, newv: 16.4,               // "Not at the old price. At what new ones cost today."
  l6: 18.5, fire: 19.5, storm: 20.0, hail: 20.5, burglary: 21.0,
  l7: 22.0, card: 23.4,                // "Protect what's inside. Talk to Robin Emig, Allianz."
  end: 30.0,
};

// ---------- palette and type ----------
const BG = "#f5f5f2", INK = "#0f172a", MUTED = "#5b6475", ACC = "#2f78d6", ACC_SOFT = "#d7e6fa", WHITE = "#ffffff";
const FONT = "Nunito, sans-serif";
const W = 1080, H = 1920;

// ---------- maths ----------
const clamp01 = (v) => Math.max(0, Math.min(1, v));
const ramp = (t, a, b) => (t <= a ? 0 : t >= b ? 1 : (t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const io = (x) => (x <= 0 ? 0 : x >= 1 ? 1 : x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const out = (x) => (x <= 0 ? 0 : x >= 1 ? 1 : 1 - Math.pow(1 - x, 3));
const expo = (x) => (x <= 0 ? 0 : x >= 1 ? 1 : 1 - Math.pow(2, -10 * x));
// Closed-form spring step (damping ratio z >= 0.72: tiny overshoot, no bounce). dur ~ settle time.
const spring = (t, t0, dur = 0.6, z = 0.78) => {
  if (t <= t0) return 0;
  const x = (t - t0) / dur, w = 7.5, wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * x) * (Math.cos(wd * x) + (z * w / wd) * Math.sin(wd * x));
};
// Seeded random (mulberry32): same value on every render.
const rng = (seed) => { let a = seed >>> 0; return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let r = Math.imul(a ^ (a >>> 15), 1 | a); r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r; return ((r ^ (r >>> 14)) >>> 0) / 4294967296; }; };

let CLIP = 0;
// Masked text rise: the line rises from below a clip edge, holds, then exits upwards.
const text = (t, s, x, y, size, { w = 800, color = INK, anchor = "middle", t0 = 0, t1 = 1e9, delay = 0 } = {}) => {
  const a = spring(t, t0 + delay, 0.55), b = ramp(t, t1, t1 + 0.35);
  if (a <= 0.001 || b >= 1) return "";
  const id = "c" + CLIP++;
  const dy = (1 - a) * size * 1.15 - io(b) * size * 1.7;
  const top = y - size * 1.0, hgt = size * 1.32;
  return `<clipPath id="${id}"><rect x="0" y="${top}" width="${W}" height="${hgt}"/></clipPath>
    <g clip-path="url(#${id})"><text x="${x}" y="${y + dy}" text-anchor="${anchor}" font-family="${FONT}" font-weight="${w}" font-size="${size}" fill="${color}">${s}</text></g>`;
};

// ---------- the drop and the shield share one 72-point outline, so one morphs into the other ----------
const N = 72;
const dropPts = (cx, cy, r) => {
  const p = [];
  for (let i = 0; i < N; i++) {
    const a = (i / N) * Math.PI * 2 - Math.PI / 2; // start at the top
    // teardrop: pointed top, round bottom
    const k = (1 - Math.sin(a)) / 2; // 1 at top, 0 at bottom
    const rr = r * (1 - 0.0 * k);
    let x = Math.cos(a) * rr * (1 - 0.72 * Math.pow(k, 2.2));
    let y = Math.sin(a) * rr;
    if (Math.sin(a) < 0) y = y * 1.55; // stretch the top into a point
    p.push([cx + x, cy + y + r * 0.25]);
  }
  return p;
};
const shieldPts = (cx, cy, s) => {
  // shield outline: flat-ish top with soft shoulders, sides, point at the bottom
  const path = (u) => {
    // u in 0..1 around the outline starting at top centre, clockwise
    const pts = [[0, -1], [0.55, -0.9], [0.86, -0.78], [0.86, -0.1], [0.62, 0.55], [0, 1.08], [-0.62, 0.55], [-0.86, -0.1], [-0.86, -0.78], [-0.55, -0.9], [0, -1]];
    const seg = u * (pts.length - 1), i = Math.min(pts.length - 2, Math.floor(seg)), f = seg - i;
    // smooth the corners a little with a cosine blend
    const g = (1 - Math.cos(f * Math.PI)) / 2 * 0.25 + f * 0.75;
    return [lerp(pts[i][0], pts[i + 1][0], g), lerp(pts[i][1], pts[i + 1][1], g)];
  };
  const p = [];
  for (let i = 0; i < N; i++) { const [x, y] = path(i / N); p.push([cx + x * s, cy + y * s]); }
  return p;
};
const morph = (A, B, k) => A.map((a, i) => [lerp(a[0], B[i][0], k), lerp(a[1], B[i][1], k)]);
const polyPath = (P) => {
  // smooth closed path through the points (Catmull-Rom to Bezier)
  let d = `M ${P[0][0].toFixed(1)},${P[0][1].toFixed(1)}`;
  for (let i = 0; i < P.length; i++) {
    const p0 = P[(i - 1 + P.length) % P.length], p1 = P[i], p2 = P[(i + 1) % P.length], p3 = P[(i + 2) % P.length];
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
    const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    d += ` C ${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  }
  return d + " Z";
};

// ---------- line-drawn furniture (stroke ink, fill white or wet blue) ----------
const SW = 7;
const sofa = (fill) => `
  <rect x="-170" y="-150" width="340" height="95" rx="26" fill="${fill}" stroke="${INK}" stroke-width="${SW}"/>
  <rect x="-200" y="-75" width="400" height="75" rx="22" fill="${fill}" stroke="${INK}" stroke-width="${SW}"/>
  <rect x="-215" y="-110" width="60" height="110" rx="24" fill="${fill}" stroke="${INK}" stroke-width="${SW}"/>
  <rect x="155" y="-110" width="60" height="110" rx="24" fill="${fill}" stroke="${INK}" stroke-width="${SW}"/>
  <line x1="0" y1="-72" x2="0" y2="-4" stroke="${INK}" stroke-width="5" opacity="0.5"/>
  <line x1="-170" y1="0" x2="-170" y2="22" stroke="${INK}" stroke-width="${SW}" stroke-linecap="round"/>
  <line x1="170" y1="0" x2="170" y2="22" stroke="${INK}" stroke-width="${SW}" stroke-linecap="round"/>`;
const laptopTable = (fill) => `
  <line x1="-120" y1="-120" x2="120" y2="-120" stroke="${INK}" stroke-width="${SW + 2}" stroke-linecap="round"/>
  <line x1="-95" y1="-120" x2="-95" y2="22" stroke="${INK}" stroke-width="${SW}" stroke-linecap="round"/>
  <line x1="95" y1="-120" x2="95" y2="22" stroke="${INK}" stroke-width="${SW}" stroke-linecap="round"/>
  <path d="M -70,-128 L -55,-235 L 75,-235 L 60,-128 Z" fill="${fill}" stroke="${INK}" stroke-width="${SW}" stroke-linejoin="round"/>
  <path d="M -48,-220 L 64,-220" stroke="${ACC}" stroke-width="5" opacity="0.5"/>
  <line x1="-95" y1="-128" x2="85" y2="-128" stroke="${INK}" stroke-width="${SW + 3}" stroke-linecap="round"/>`;
const lamp = (fill) => `
  <line x1="0" y1="0" x2="0" y2="-300" stroke="${INK}" stroke-width="${SW}" stroke-linecap="round"/>
  <line x1="-40" y1="0" x2="40" y2="0" stroke="${INK}" stroke-width="${SW}" stroke-linecap="round"/>
  <path d="M -55,-300 L -35,-390 L 35,-390 L 55,-300 Z" fill="${fill}" stroke="${INK}" stroke-width="${SW}" stroke-linejoin="round"/>`;
const rug = (fill) => `<ellipse cx="0" cy="0" rx="300" ry="30" fill="${fill === WHITE ? ACC_SOFT : fill}" stroke="${INK}" stroke-width="${SW}"/>`;

const item = (draw, x, y, s, r, fill, op = 1) =>
  s <= 0.001 || op <= 0.001 ? "" : `<g transform="translate(${x} ${y}) rotate(${r}) scale(${s})" opacity="${op}">${draw(fill)}</g>`;

// ---------- icons for the cover row (stroke only) ----------
const ICON = {
  fire: `<path d="M 0,-62 C 30,-30 48,-8 42,22 C 36,52 12,62 0,62 C -12,62 -40,52 -42,22 C -44,-4 -24,-14 -18,-34 C -6,-18 -2,-10 6,-8 C 10,-30 4,-46 0,-62 Z" fill="none" stroke="${INK}" stroke-width="7" stroke-linejoin="round"/>`,
  storm: `<path d="M -54,-26 H 30 C 52,-26 52,-56 32,-56 M -54,0 H 48 C 72,0 72,36 48,36 M -54,26 H 12 C 32,26 32,52 14,52" fill="none" stroke="${INK}" stroke-width="7" stroke-linecap="round"/>`,
  hail: `<path d="M -50,10 C -74,10 -74,-28 -46,-30 C -42,-60 -2,-66 10,-40 C 38,-56 64,-30 52,-6 C 70,0 64,24 44,22 Z" fill="none" stroke="${INK}" stroke-width="7" stroke-linejoin="round"/>
         <circle cx="-30" cy="46" r="8" fill="${INK}"/><circle cx="0" cy="58" r="8" fill="${INK}"/><circle cx="30" cy="46" r="8" fill="${INK}"/>`,
  burglary: `<rect x="-40" y="-6" width="80" height="62" rx="12" fill="none" stroke="${INK}" stroke-width="7"/>
         <path d="M -24,-6 V -28 C -24,-60 24,-60 24,-28 V -18" fill="none" stroke="${INK}" stroke-width="7" stroke-linecap="round"/>
         <path d="M -10,14 L 4,26 L -6,40" fill="none" stroke="${ACC}" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>`,
};

// ---------- the film ----------
function frame(t) {
  CLIP = 0;
  let s = "";

  // background: dims for "one night", back to warm white after the drain
  const night = ramp(t, T.l2 - 0.2, T.l2 + 0.6) * (1 - ramp(t, T.insure - 0.6, T.insure));
  const bg = night > 0 ? `rgb(${Math.round(lerp(245, 226, night))},${Math.round(lerp(245, 229, night))},${Math.round(lerp(242, 236, night))})` : BG;
  s += `<rect width="${W}" height="${H}" fill="${bg}"/>`;

  // camera: slow push, a small punch on the burst, then calm
  const push = 1 + 0.035 * io(ramp(t, 0, T.bursts)) - 0.035 * io(ramp(t, T.insure - 0.6, T.insure + 0.4));
  const punch = t > T.bursts ? 0.03 * Math.exp(-(t - T.bursts) * 6) : 0;
  const z = push + punch;
  s += `<g transform="translate(540 1080) scale(${z * 1.1}) translate(-540 -960)">`;

  // ===== room (0 .. insure) =====
  const roomOut = ramp(t, T.insure - 0.5, T.insure - 0.1);
  const FLOOR = 1330;
  if (t < T.insure) {
    const draw = io(ramp(t, 0.0, 0.9));
    const L = 2 * (960 + 620);
    s += `<path d="M 60,${FLOOR - 620} V ${FLOOR} H 1020 V ${FLOOR - 620}" fill="none" stroke="${INK}" stroke-width="6" stroke-linecap="round" opacity="${0.35 * (1 - roomOut)}" stroke-dasharray="${L}" stroke-dashoffset="${L * (1 - draw)}"/>`;
    // pipe along the ceiling, joint at x=700
    const pipe = io(ramp(t, 0.3, 1.1));
    s += `<line x1="60" y1="760" x2="${60 + 960 * pipe}" y2="760" stroke="${INK}" stroke-width="20" stroke-linecap="round" opacity="${1 - roomOut}"/>`;
    s += `<rect x="680" y="742" width="40" height="36" rx="8" fill="${BG}" stroke="${INK}" stroke-width="6" opacity="${pipe * (1 - roomOut)}"/>`;
    // the crack on "bursts"
    if (t >= T.bursts - 0.05) {
      const c = out(ramp(t, T.bursts - 0.05, T.bursts + 0.1));
      s += `<path d="M 690,778 l 8,16 l -10,12 l 10,14" fill="none" stroke="${ACC}" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="${c * (1 - roomOut)}"/>`;
    }
  }

  // furniture: pops in at the start, wet in the water, gone in the drain, back NEW later
  const wet = ramp(t, T.bursts + 0.4, T.bursts + 0.9);
  const fillNow = wet > 0.5 && t < T.insure ? "#bcd3f2" : WHITE;
  const floatR = (seed) => (t > T.bursts + 0.5 && t < T.insure ? Math.sin(t * 2.2 + seed) * 3.5 : 0);
  const floatY = (seed) => (t > T.bursts + 0.5 && t < T.insure ? Math.sin(t * 1.7 + seed) * 6 - 10 * wet : 0);
  const gone = 1 - ramp(t, T.insure - 0.5, T.insure - 0.15);
  if (t < T.insure) {
    s += item(rug, 470, FLOOR - 4 + floatY(1) * 0.3, spring(t, 0.25, 0.5), 0, fillNow, gone);
    s += item(sofa, 420, FLOOR - 26 + floatY(2), spring(t, 0.45, 0.55), floatR(2), fillNow, gone);
    s += item(lamp, 150, FLOOR - 4 + floatY(3), spring(t, 0.65, 0.55), floatR(3) * 1.5, fillNow, gone);
    s += item(laptopTable, 820, FLOOR - 26 + floatY(4), spring(t, 0.85, 0.55), floatR(4), fillNow, gone);
  }

  // "Example" chip during the story part
  const ex = spring(t, T.l2 + 0.3, 0.5) * (1 - ramp(t, T.insure - 0.6, T.insure - 0.3));
  if (ex > 0.01) {
    s += `<g opacity="${ex}" transform="translate(960 640)"><rect x="-120" y="-30" width="140" height="56" rx="28" fill="none" stroke="${MUTED}" stroke-width="3"/>
      <text x="-50" y="10" text-anchor="middle" font-family="${FONT}" font-weight="700" font-size="28" fill="${MUTED}">Example</text></g>`;
  }

  // the drop: forms at the joint, falls, splashes
  if (t >= T.drop && t < T.bursts) {
    const grow = spring(t, T.drop, 0.6);
    const fall = clamp01((t - (T.drop + 0.7)) / 0.45);
    const y = 790 + fall * fall * (FLOOR - 820);
    if (fall < 1) s += `<path d="${polyPath(dropPts(700, y, 16 * grow))}" fill="${ACC}"/>`;
    const sp = ramp(t, T.drop + 1.15, T.drop + 1.6);
    if (sp > 0 && sp < 1) s += `<ellipse cx="700" cy="${FLOOR - 4}" rx="${10 + 70 * out(sp)}" ry="${4 + 8 * out(sp)}" fill="none" stroke="${ACC}" stroke-width="5" opacity="${1 - sp}"/>`;
  }

  // the flood: a circle from the crack that clears the farthest corner, then settles to a water level
  if (t >= T.bursts && t < T.insure + 0.1) {
    const cx = 700, cy = 790;
    const R = Math.max(Math.hypot(cx, cy), Math.hypot(W - cx, cy), Math.hypot(cx, H - cy), Math.hypot(W - cx, H - cy)) * 1.05 / 1; // in world units
    const f = expo(ramp(t, T.bursts, T.bursts + 0.35));
    const settle = io(ramp(t, T.bursts + 0.55, T.bursts + 1.3));
    const drain = io(ramp(t, T.insure - 1.0, T.insure - 0.3));
    const level = lerp(lerp(-200, 1150, settle), FLOOR + 10, drain);
    if (settle <= 0) {
      s += `<circle cx="${cx}" cy="${cy}" r="${R * f}" fill="${ACC}" opacity="0.92"/>`;
    } else {
      const amp = 10 * (1 - drain * 0.7);
      let d = `M -100,${level}`;
      for (let x = -100; x <= W + 100; x += 30) d += ` L ${x},${(level + Math.sin(x / 70 + t * 3.2) * amp).toFixed(1)}`;
      d += ` L ${W + 100},${H + 300} L -100,${H + 300} Z`;
      s += `<path d="${d}" fill="${ACC}" opacity="${0.82 * (1 - ramp(t, T.insure - 0.35, T.insure))}"/>`;
    }
  }

  // drain: the water gathers into one drop, the drop rises and becomes the shield
  const shieldT0 = T.insure - 0.35;
  let shieldCx = 540, shieldCy = 820, shieldS = 1;
  // after the insurance line, the shield moves to the top and stays small
  const up = io(ramp(t, T.old - 0.3, T.old + 0.4));
  if (t >= shieldT0) {
    const gather = io(ramp(t, shieldT0, shieldT0 + 0.45));
    const rise = io(ramp(t, shieldT0 + 0.2, shieldT0 + 0.75));
    const m = io(ramp(t, shieldT0 + 0.65, shieldT0 + 1.15));
    const dropCy = lerp(FLOOR - 20, 820, rise), dropR = lerp(30, 140, rise);
    const cx = lerp(540, 540, up), cy = lerp(dropCy, 400, up), sc = lerp(1, 0.42, up);
    const A = dropPts(0, 0, dropR), B = shieldPts(0, 0, 185);
    const P = morph(A, B, m);
    if (gather < 1) s += `<ellipse cx="540" cy="${FLOOR + 6}" rx="${lerp(460, 40, gather)}" ry="${lerp(18, 26, gather)}" fill="${ACC}" opacity="${1 - gather}"/>`;
    s += `<g transform="translate(${cx} ${cy}) scale(${sc})"><path d="${polyPath(P)}" fill="${ACC}"/>`;
    const chk = out(ramp(t, shieldT0 + 1.05, shieldT0 + 1.45));
    if (chk > 0) s += `<path d="M -60,0 L -12,46 L 70,-48" fill="none" stroke="${WHITE}" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="230" stroke-dashoffset="${230 * (1 - chk)}"/>`;
    // live micro drift so the shield never freezes
    s += `</g>`;
    shieldCx = cx; shieldCy = cy; shieldS = sc;
  }

  s += `</g>`; // end camera

  // ===== kinetic type (outside the camera so it stays razor sharp) =====
  s += text(t, "Your home.", 540, 470, 104, { t0: T.l1 - 0.05, t1: T.l2 - 0.4 });
  s += text(t, "Everything you own.", 540, 580, 60, { w: 700, color: MUTED, t0: T.everything, t1: T.l2 - 0.4 });
  s += text(t, "Then one night...", 540, 470, 96, { t0: T.l2, t1: T.bursts - 0.25 });
  s += text(t, "the pipe bursts.", 540, 470, 104, { t0: T.bursts - 0.25, t1: T.sofa - 0.3, color: INK });
  // over the water: names land on their words
  const wT1 = T.insure - 0.6;
  s += text(t, "The sofa.", 540, 430, 92, { t0: T.sofa, t1: T.laptop - 0.15 });
  s += text(t, "The laptop.", 540, 430, 92, { t0: T.laptop - 0.15, t1: T.rug - 0.15 });
  s += text(t, "The rug.", 540, 430, 92, { t0: T.rug - 0.15, t1: T.ruined - 0.15 });
  s += text(t, "Ruined.", 540, 430, 120, { t0: T.ruined - 0.15, t1: wT1, w: 900 });
  // insurance
  s += text(t, "Household contents", 540, 1240, 84, { t0: T.insure + 0.5, t1: T.old - 0.4, w: 900 });
  s += text(t, "insurance", 540, 1340, 84, { t0: T.insure + 0.62, t1: T.old - 0.4, w: 900 });
  s += text(t, "Hausratversicherung", 540, 1450, 56, { t0: T.insure + 0.9, t1: T.old - 0.4, w: 800, color: ACC });
  s += text(t, "Replaced at new value.", 540, 1565, 46, { t0: T.insure + 1.6, t1: T.old - 0.4, w: 700, color: MUTED });

  // ===== new value (old .. l6) =====
  if (t >= T.old - 0.2 && t < T.l6 + 0.6) {
    const ex2 = 1 - ramp(t, T.l6 - 0.2, T.l6 + 0.3);
    const yOff = 300 * io(ramp(t, T.l6 - 0.2, T.l6 + 0.3));
    s += `<g transform="translate(0 ${yOff})" opacity="${ex2}">`;
    s += item(rug, 540, 1150, spring(t, T.old + 0.05, 0.5) * 0.9, 0, WHITE);
    s += item(sofa, 400, 1130, spring(t, T.old + 0.15, 0.55) * 0.9, 0, WHITE);
    s += item(laptopTable, 800, 1130, spring(t, T.old + 0.3, 0.55) * 0.9, 0, WHITE);
    // tags
    const oldIn = spring(t, T.old + 0.4, 0.5), strike = out(ramp(t, T.newv - 0.3, T.newv));
    if (oldIn > 0.01) {
      s += `<g transform="translate(${540 - 230 * strike} 1320) scale(${lerp(1, 0.8, strike)})" opacity="${oldIn * lerp(1, 0.45, strike)}">
        <rect x="-170" y="-48" width="340" height="96" rx="48" fill="none" stroke="${INK}" stroke-width="5"/>
        <text x="0" y="16" text-anchor="middle" font-family="${FONT}" font-weight="800" font-size="46" fill="${INK}">Old value</text>
        <line x1="-150" y1="2" x2="${-150 + 300 * strike}" y2="2" stroke="${INK}" stroke-width="7" stroke-linecap="round"/></g>`;
    }
    const nw = spring(t, T.newv, 0.55);
    if (nw > 0.01) {
      s += `<g transform="translate(${lerp(760, 690, nw)} 1320)" opacity="${clamp01(nw)}">
        <rect x="-215" y="-54" width="430" height="108" rx="54" fill="${ACC}"/>
        <text x="-40" y="18" text-anchor="middle" font-family="${FONT}" font-weight="900" font-size="50" fill="${WHITE}">New value</text>
        <path d="M 130,0 L 152,22 L 186,-20" fill="none" stroke="${WHITE}" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></g>`;
    }
    s += `</g>`;
  }
  s += text(t, "Not the old price.", 540, 720, 84, { t0: T.old, t1: T.newv - 0.2, w: 900 });
  s += text(t, "What new ones cost today.", 540, 720, 72, { t0: T.newv - 0.2, t1: T.l6 - 0.2, w: 900 });

  // ===== also covered (l6 .. l7) =====
  s += text(t, "Also covered", 540, 720, 84, { t0: T.l6, t1: T.l7 - 0.2, w: 900 });
  const cells = [["fire", "Fire", 330, 960], ["storm", "Storm", 750, 960], ["hail", "Hail", 330, 1400], ["burglary", "Burglary", 750, 1400]];
  for (const [k, label, x, y] of cells) {
    const p = spring(t, T[k] - 0.05, 0.5), q = 1 - io(ramp(t, T.l7 - 0.3, T.l7 + 0.1));
    if (p * q <= 0.01) continue;
    s += `<g transform="translate(${x} ${y}) scale(${p * q})">
      <circle r="120" fill="${WHITE}" stroke="${INK}" stroke-width="6"/>
      <g transform="translate(0 -6) scale(1.25)">${ICON[k]}</g>
      <text x="0" y="185" text-anchor="middle" font-family="${FONT}" font-weight="800" font-size="50" fill="${INK}">${label}</text></g>`;
  }

  // ===== end card (l7 .. end) =====
  s += text(t, "Protect what's inside.", 540, 720, 80, { t0: T.l7, t1: 1e9, w: 900 });
  const c = spring(t, T.card, 0.65);
  if (c > 0.01) {
    const drift = 1 + 0.012 * ramp(t, T.card, T.end);
    s += `<g transform="translate(540 ${lerp(1500, 1180, c)}) scale(${drift})" opacity="${clamp01(c * 1.4)}">
      <rect x="-450" y="-300" width="900" height="600" rx="48" fill="${WHITE}" stroke="#e3e6ec" stroke-width="3"/>
      <text x="0" y="-120" text-anchor="middle" font-family="${FONT}" font-weight="900" font-size="108" fill="${INK}">Robin Emig</text>
      <text x="0" y="-30" text-anchor="middle" font-family="${FONT}" font-weight="900" font-size="62" fill="${ACC}">Allianz</text>
      <line x1="-300" y1="40" x2="300" y2="40" stroke="#e3e6ec" stroke-width="5"/>
      <rect x="-390" y="100" width="780" height="130" rx="65" fill="${ACC_SOFT}"/>
      <g transform="translate(-320 165) scale(1.1)"><path d="M -18,-30 C -26,-30 -32,-24 -30,-14 C -25,12 -6,31 18,34 C 27,35 34,30 34,22 L 34,12 C 34,7 31,4 26,4 L 16,4 C 11,4 9,9 7,12 C -3,9 -12,0 -15,-10 C -10,-12 -7,-15 -7,-20 L -7,-30 C -7,-35 -10,-37 -15,-37 Z" fill="${ACC}"/></g>
      <text x="40" y="188" text-anchor="middle" font-family="${FONT}" font-weight="900" font-size="64" fill="${INK}">+49 160 97626099</text>
    </g>`;
    const fn = ramp(t, T.card + 0.8, T.card + 1.2);
    s += `<text x="540" y="1640" text-anchor="middle" font-family="${FONT}" font-weight="700" font-size="34" fill="${MUTED}" opacity="${fn}">Cover depends on your policy.</text>`;
  }

  // fade in from and out to background over a few frames
  const fade = Math.max(1 - ramp(t, 0, 0.25), ramp(t, T.end - 0.25, T.end));
  if (fade > 0) s += `<rect width="${W}" height="${H}" fill="${BG}" opacity="${fade}"/>`;
  return s;
}

const stage = document.getElementById("stage");
window.seek = async (t) => { stage.innerHTML = frame(t); document.getElementById("hud").textContent = location.search.includes("hud") ? t.toFixed(2) + " s" : ""; };
window.DURATION = T.end;
document.fonts.load('900 40px "Nunito"').then(() => document.fonts.ready).then(() => { window.seek(0); window.ready = true; });

// preview controls: Space play/pause, arrows step one frame, R replay
let playing = false, pt = 0, last = 0;
const loop = (now) => { if (!playing) return; pt += (now - last) / 1000; last = now; if (pt > T.end) pt = 0; window.seek(pt); requestAnimationFrame(loop); };
addEventListener("keydown", (e) => {
  if (e.code === "Space") { playing = !playing; last = performance.now(); if (playing) requestAnimationFrame(loop); }
  if (e.code === "ArrowRight") { pt += 1 / 30; window.seek(pt); }
  if (e.code === "ArrowLeft") { pt = Math.max(0, pt - 1 / 30); window.seek(pt); }
  if (e.code === "KeyR") { pt = 0; window.seek(0); }
});
</script>
